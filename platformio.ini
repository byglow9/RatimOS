; RatimOS — ambiente de desenvolvimento
;
; native_sim: roda a UI inteira no PC via SDL2, sem precisar de nenhuma placa.
;             use `pio run -e native_sim -t exec` (ou apenas `pio run -e native_sim`
;             e rode o binário gerado em .pio/build/native_sim/program).
;
; esp32s3   : ambiente para a placa real (Waveshare ESP32-S3-Touch-LCD-3.5).
;             fica de fora até a Fase 1 do plano (compra/bring-up de hardware).

[env:native_sim]
platform = native
build_flags =
    -std=gnu11
    -I.
    -Isrc
    -DLV_CONF_INCLUDE_SIMPLE
    -lSDL2
lib_deps =
    lvgl/lvgl@^9.2.2
lib_ldf_mode = deep+
build_src_filter =
    +<*>
    -<board/waveshare_s3_35/*>
test_build_src = yes
